<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DR HOME Login</title><style>*{box-sizing:border-box}body{margin:0;background:#080809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:56px 22px;background:radial-gradient(circle at 50% 5%,#202226 0,#101113 30%,#080809 68%)}.brand{text-align:center;font-weight:850;letter-spacing:2px;font-size:22px;margin-bottom:34px}h1{text-align:center;font-size:30px;margin:0 0 28px}.field{margin:14px 0}label{display:block;color:#a7aab0;font-size:11px;text-transform:uppercase;margin:0 0 8px 3px}input{width:100%;height:52px;border-radius:15px;border:1px solid #303237;background:#17181b;color:#fff;padding:0 15px;font-size:15px}.btn{margin-top:22px;background:#fff;color:#111;border-radius:16px;padding:16px;text-align:center;font-weight:780;cursor:pointer}.error{display:none;margin-top:12px;color:#f1aaaa;font-size:12px}.register{text-align:center;margin-top:20px;color:#8e9197;font-size:13px}.register a{color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="app"><div class="brand">DR HOME™</div><h1>Welcome back.</h1><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="error" id="error"></div><div class="btn" id="loginBtn">Sign in</div><div class="register">New customer? <a href="/register.html">Create account</a></div></main><script src="/auth.js"></script><script>const $=id=>document.getElementById(id);$('loginBtn').onclick=async()=>{const e=$('error');e.style.display='none';try{const r=await window.drhomeLogin($('email').value,$('password').value);if(r.ok){location.href='/';return;}e.textContent='Email or password is incorrect.';e.style.display='block'}catch(_){e.textContent='Could not reach the DR HOME server.';e.style.display='block'}};</script></body></html>
