services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: drhome-postgres:16
    container_name: drhome-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drhome}
      POSTGRES_USER: ${POSTGRES_USER:-drhome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - drhome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drhome} -d ${POSTGRES_DB:-drhome}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [drhome-internal]

  api:
    build: .
    container_name: drhome-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-drhome}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-drhome}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-https://app.drhome.ae}
      COOKIE_NAME: ${COOKIE_NAME:-drhome_sid}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@drhome.ae}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ChangeMe123!}
    ports:
      - "${API_HOST_PORT:-3051}:3000"
    networks: [drhome-internal]

volumes:
  drhome_pgdata:

networks:
  drhome-internal:
    driver: bridge
